<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="[jouw naam]" />
    <meta name="color-scheme" content="dark light" />

    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", sans-serif;
        color: #f8ecff;
        background: #140b22;
      }

      * { box-sizing: border-box; }

      body {
        max-width: 1000px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px;
        background: radial-gradient(circle at top, #522378, #140b22 65%);
      }

      header {
        position: relative;
        overflow: hidden;
        margin-bottom: 28px;
        padding: 42px 22px 28px;
        text-align: center;
        border: 2px solid #d89aff;
        border-radius: 24px;
        background: linear-gradient(135deg, #762f9e, #24113e 78%);
        box-shadow: 0 0 30px #b455d477;
      }

      header:hover .side-gif.left {
        transform: translateX(-18px) scale(1.08);
      }

      header:hover .side-gif.right {
        transform: translateX(18px) scale(1.08);
      }

      .side-gif {
        position: absolute;
        top: 50%;
        z-index: 0;
        width: 82px;
        height: 96px;
        object-fit: contain;
        transform: translateY(-50%);
        transition: transform .3s ease;
      }

      .side-gif.left { left: 12px; }
      .side-gif.right { right: 12px; }

      header h1,
      header nav {
        position: relative;
        z-index: 1;
      }

      header::before {
        content: "✦  ✧  ✦  ✧  ✦";
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        color: #f5c8ff;
        letter-spacing: 12px;
      }

      h1 {
        margin: 0 0 22px;
        color: #fff;
        font-size: clamp(2.2rem, 8vw, 5rem);
        letter-spacing: .12em;
        white-space: nowrap;
        text-shadow: 3px 3px #32104e, 0 0 18px #f09cff;
      }

      nav ul {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      nav a {
        display: block;
        padding: 10px 17px;
        color: #fff;
        text-decoration: none;
        border: 1px solid #e3a8ff;
        border-radius: 999px;
        background: #3f1d61cc;
        transition: .2s ease;
      }

      nav a:hover {
        color: #32104e;
        background: #f2c5ff;
        transform: translateY(-2px);
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }

      article {
        padding: 24px;
        border: 1px solid #bd72e8;
        border-radius: 18px;
        background: #291541dd;
        box-shadow: 0 8px 20px #09040f88;
      }

      h2 { margin-top: 0; color: #e9aaff; }
      footer { margin-top: 30px; color: #d5aee4; text-align: center; }
    </style>

    <title>SMR UNIVERSE</title>

    <link rel="stylesheet" href="./assets/style/normal.css" />

    <script
      data-page="[https://typesmr.nl]"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
  </head>
  <body>
    <header>
      <img
        class="side-gif left"
        alt="mimikyu"
        src="https://github.com/user-attachments/assets/69287044-d5de-4ddd-827f-d492f5bb7d2b"
      />
      <img
        class="side-gif right"
        alt="crobat"
        src="assets/style/piccies/crobat 1.gif"
      />
      <h1>SMR UNIVERSE</h1>

      <nav>
        <ul>
          <li><a href="/">[Home]</a></li>
          <li>
            <a href="https://github.com/SMR033/typesmr/blob/main/README.md"
              >[Log]</a
            >
          </li>
          <li><a href="oefeningen/presentatie/index.html">[Manga]</a></li>
          <li><a href="/contact.html">[Contact]</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <article>
        <h2>Why is SMR the goat?</h2>
        <p>Because it's SMR.</p>
      </article>

      <article>
        <h2>coming soon...</h2>
        <p>This will be something epic soon.... very soon!</p>
      </article>
    </main>

    <footer>
      <p>
        &copy; 2026 SMR Universe. All rights reserved. | <a href="/privacy.html">Privacy Policy</a>
      </p>
    </footer>
  </body>
</html>
