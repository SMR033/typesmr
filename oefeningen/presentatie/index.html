# Hoe manga mij, maar ook talloze anderen inspireert!
Gemaakt door de enige echte Samir


---
class: center, middle

# Mijn eerste anime
Ik weet nog precies het moment dat ik mijn allereerste **anime** keek.
Nadat ik besefte hoeveel mijn neef wilde dat ik de japanse animatie series zou gaan kijken, 
gaf ik het een kans en uiteindelijk heeft het een grote impact achtergelaten op mijn gehele kijk op niet alleen animatie maar ook manga/strip comics.

---
class: center, middle

# Waarom manga een inspiratiebron is
De tekenstijl, de soms rauwe emotie, en dat gevoel dat je je even helemaal verdiept in het leven van iemand anders.
het raakt elke keer weer een andere snaar in mijn hoofd. Van pure actie tot die stille, persoonlijke momenten... manga laat zien hoeveel je kunt zeggen met gewoon lijnen en compositie.


---
class: center, middle
# Wat me op viel bij manga
Toen ik mijn eigen manga verzameling  ging bekijken, ontdekte ik
dat er vijf dingen steeds terugkomen:

- **Tekenstijl**  grote ogen, dynamische lijnen
- **Emotie & expressie**  overdreven maar herkenbare gezichten
- **Actie & beweging**  vaartlijnen, dynamische panelen
- **Zwart-wit vs kleur**  contrast als stijlmiddel
- **Personages**  iconische, herkenbare characters

<img class="klein-plaatje" src="./afbeeldingen-presentatie/manga-boek-open.jpg"/>

---
class: center, middle
# Artstyle
Wat me telkens opvalt is dat de tekenstijl zelf al zoveel kan zeggen. Grote, expressieve ogen die precies laten zien wat een personage voelt, 
scherpe actielijnen die snelheid en kracht tonen, en soms hyperdetail in een enkel paneel terwijl de rest juist heel simpel blijft.
Die balans tussen minimalisme en detail is denk ik wat manga zo herkenbaar maakt.

---
class: center, middle
# Expressie van de verhalen
Wat manga zo sterk maakt, is hoeveel er verteld wordt zonder dat er veel gezegd hoeft te worden.
ÉEen blik, een stilte tussen twee panelen, en je voelt precies wat een personage doormaakt.
Juist die emotionele laag onder het verhaal is wat me elke keer weer raakt.

---
class: center, middle
# Beweging in stil beeld brengen
Een still image, maar het voelt alsof het beweegt. Vaartlijnen, scheve panelen, een figuur die net buiten
beeld lijkt te schieten. Manga gebruikt compositie om snelheid en actie te suggereren zonder dat er
daadwerkelijk iets beweegt. Dat trucje blijft me fascineren.

---

class: center, middle
# Zwart-wit zegt meer dan je denkt
Zwart-wit zegt meer dan je denkt. Doordat er geen kleur is, vult je brein automatisch dingen aan: kleuren, texturen, sfeer, 
details die er eigenlijk niet eens staan. Dat maakt het lezen actiever, 
je wordt zelf een beetje medemaker van het beeld.

---
class: center, middle

# De personages die blijven hangen
Sommige personages laten je niet meer los, ook lang nadat je het verhaal hebt uitgelezen. 
Het zijn niet alleen hun krachten of uiterlijk die blijven hangen, maar vooral hun groei, 
hun fouten en hoe herkenbaar menselijk ze soms zijn, ondanks dat het tekeningen zijn. 
Dat is denk ik de echte kracht van manga, de personages die voelen als mensen die je kent.
---
class: center, middle
# Wat dit me leert
Manga is een kunstvorm die met weinig middelen veel emotie overbrengt.

Het is meer dan entertainment: het is vakmanschap, compositie en
storytelling in beeld, en dat is precies waarom het niet voor niets
miljoenen mensen wereldwijd raakt.

---
class: center, middle
# Hoe ik dit verder vertel
Ik vertel dit verder met eigen content, zoals mijn favoriete panelen, korte reflecties en eigen tekeningen,
en met overige content, zoals de bronnen hierna, de beeldcollages en quotes van mangaka's.

Samen bouwen die aan een verhaal dat zowel persoonlijk als onderbouwd is.

---
class: center, middle

# In het kort
Manga is meer dan een stripvorm, het is emotie, beweging en expressie in
inkt. Ik onderzoek waarom deze kunstvorm mij en miljoenen anderen wereldwijd
raakt.
---
class: center, middle
# Bronnen
1. en.wikipedia.org/wiki/Manga: geschiedenis en ontwikkeling
2. tezukaosamu.net: over Osamu Tezuka, "god van manga"
3. animenewsnetwork.com: nieuws en analyses over de industrie
4. myanimelist.net: database, populariteit en trends
5. crunchyroll.com/news: actuele releases
6. polygon.com/manga: westerse blik op mangacultuur
7. kotaku.com/tag/manga: invloed op games en pop culture
8. viz.com: uitgever, mangaka-interviews
9. japan-guide.com: culturele context in Japan
10. britannica.com/art/manga: kenmerken en achtergrond
