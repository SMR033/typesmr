# Hoe manga mij, maar ook talloze anderen, inspireert
Gemaakt door de enige echte Samir Akalliche
---
# Agenda
1. Onderwerp: manga
2. 10 links
3. 50 afbeeldingen & patronen
4. Wat ik wil vertellen
5. Introtekst
---
# Onderwerp
Manga is mijn passie sinds ik als kind mijn eerste volume in handen kreeg.

De tekenstijl, de emotie, de manier waarop een enkel paneel een heel gevoel
kan overbrengen — dat trekt me al jaren aan. Van actie-reeksen tot stille,
persoonlijke momenten: manga laat zien hoeveel je kunt zeggen met lijnen
en compositie.
---
# 10 links
1. en.wikipedia.org/wiki/Manga — geschiedenis en ontwikkeling
2. tezukaosamu.net — over Osamu Tezuka, "god van manga"
3. animenewsnetwork.com — nieuws en analyses over de industrie
4. myanimelist.net — database, populariteit en trends
5. crunchyroll.com/news — actuele releases
6. polygon.com/manga — westerse blik op mangacultuur
7. kotaku.com/tag/manga — invloed op games en pop culture
8. viz.com — uitgever, mangaka-interviews
9. japan-guide.com — culturele context in Japan
10. britannica.com/art/manga — kenmerken en achtergrond

Deze links hielpen me om mijn persoonlijke fascinatie te koppelen aan de
bredere geschiedenis en cultuur achter manga.
---
# Zoek 50 afbeeldingen
Mijn verzameling draait om vijf terugkerende patronen:

- **Tekenstijl** — grote ogen, dynamische lijnen
- **Emotie & expressie** — overdreven maar herkenbare gezichtsuitdrukkingen
- **Actie & beweging** — vaartlijnen, dynamische panelen
- **Zwart-wit vs kleur** — contrast als stijlmiddel
- **Personages** — iconische, herkenbare characters

Deze patronen komen telkens terug, ongeacht de serie of het genre.

# Wat wil ik vertellen?
Manga is een kunstvorm die met weinig middelen veel emotie overbrengt.

Ik wil laten zien dat het meer is dan entertainment: het is vakmanschap,
compositie en storytelling in beeld — en dat het niet voor niets miljoenen
mensen wereldwijd raakt.
---
# Hoe vertel ik dit verder?
- **Eigen content:** mijn favoriete panelen, korte reflecties, eigen tekeningen
- **Overige content:** de 10 links, de beeldcollages, quotes van mangaka's

Samen bouwen die aan een verhaal dat zowel persoonlijk als onderbouwd is.
---
# Introtekst
Manga is meer dan een stripvorm — het is emotie, beweging en expressie in
inkt. Ik onderzoek waarom deze kunstvorm mij en miljoenen anderen wereldwijd
raakt.
