Gemaakt door de enige echte Samir


---
class: center, middle

# Het begon met mijn eerste anime
Ik weet nog precies het moment dat ik mijn allereerste **anime** keek.
Nadat ik besefte hoeveel mijn neef wilde dat ik de japanse animatie series zou gaan kijken, 
gaf ik het een kans en uiteindelijk heeft het een grote impact achtergelaten op mijn gehele kijk op niet alleen animatie maar ook manga/strip comics.

---


# Waarom manga mij amuseert en anders laat denken?
De tekenstijl, de soms rauwe emotie, en dat gevoel dat je je even helemaal verdiept in het leven van iemand anders.
het raakt elke keer weer een andere snaar in mijn hoofd. Van pure actie tot die stille, persoonlijke momenten... manga laat zien hoeveel je kunt zeggen met gewoon lijnen en compositie.


---
# Wat ik ben gaan zien
Toen ik mijn eigen verzameling afbeeldingen ging bekijken, ontdekte ik
dat er vijf dingen steeds terugkomen:

- **Tekenstijl**  grote ogen, dynamische lijnen
- **Emotie & expressie**  overdreven maar herkenbare gezichten
- **Actie & beweging**  vaartlijnen, dynamische panelen
- **Zwart-wit vs kleur**  contrast als stijlmiddel
- **Personages**  iconische, herkenbare characters

# Wat dit me leert
Manga is een kunstvorm die met weinig middelen veel emotie overbrengt.

Het is meer dan entertainment: het is vakmanschap, compositie en
storytelling in beeld — en dat is precies waarom het niet voor niets
miljoenen mensen wereldwijd raakt.
---
# Hoe ik dit verder vertel
- **Eigen content:** mijn favoriete panelen, korte reflecties, eigen tekeningen
- **Overige content:** de bronnen hierna, de beeldcollages, quotes van mangaka's

Samen bouwen die aan een verhaal dat zowel persoonlijk als onderbouwd is.

class: center, middle

# In het kort
Manga is meer dan een stripvorm — het is emotie, beweging en expressie in
inkt. Ik onderzoek waarom deze kunstvorm mij en miljoenen anderen wereldwijd
raakt.

# Bronnen
1. en.wikipedia.org/wiki/Manga — geschiedenis en ontwikkeling
2. tezukaosamu.net — over Osamu Tezuka, "god van manga"
3. animenewsnetwork.com — nieuws en analyses over de industrie
4. myanimelist.net — database, populariteit en trends
5. crunchyroll.com/news — actuele releases
6. polygon.com/manga — westerse blik op mangacultuur
7. kotaku.com/tag/manga — invloed op games en pop culture
8. viz.com — uitgever, mangaka-interviews
9. japan-guide.com — culturele context in Japan
10. britannica.com/art/manga — kenmerken en achtergrond
